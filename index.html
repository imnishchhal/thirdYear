
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Details Form</h2>

    <form action="/submit-student-details" method="POST">
        
        <fieldset>
            <legend>Personal Details</legend>
            
            <label for="fname">First Name:</label><br>
            <input type="text" id="fname" name="firstname" required><br><br>

            <label for="lname">Last Name:</label><br>
            <input type="text" id="lname" name="lastname" required><br><br>

            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob" required><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Contact Information</legend>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Academic Information</legend>

            <label for="student_id">Student ID:</label><br>
            <input type="text" id="student_id" name="student_id" required><br><br>

            <label for="course">Select Course:</label><br>
            <select id="course" name="course">
                <option value="cs">Computer Science</option>
                <option value="it">Information Technology</option>
                <option value="ee">Electrical Engineering</option>
                <option value="me">Mechanical Engineering</option>
            </select><br><br>

            <label>Extracurricular Activities:</label><br>
            <input type="checkbox" id="sports" name="activities" value="sports">
            <label for="sports">Sports</label><br>
            <input type="checkbox" id="music" name="activities" value="music">
            <label for="music">Music</label><br>
            <input type="checkbox" id="arts" name="activities" value="arts">
            <label for="arts">Arts & Drama</label><br><br>
        </fieldset>

        <br>

        <input type="submit" value="Submit Details">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
