<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        /* Chessboard Container Grid */
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 8px solid #3d2314;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
        }

        /* Square Base Style */
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        /* Light & Dark Square Colors */
        .white {
            background-color: #f0d9b5;
        }

        .black {
            background-color: #b58863;
        }

        /* Hover Effect */
        .square:hover {
            opacity: 0.85;
            outline: 2px solid #333;
        }

        /* Piece Colors */
        .piece.black-piece {
            color: #111;
            filter: drop-shadow(0 1px 1px rgba(255,255,255,0.3));
        }

        .piece.white-piece {
            color: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }
    </style>
</head>
<body>

    <div class="chessboard">
        <!-- Row 8 -->
        <div class="square white"><span class="piece black-piece">&#9820;</span></div>
        <div class="square black"><span class="piece black-piece">&#9822;</span></div>
        <div class="square white"><span class="piece black-piece">&#9821;</span></div>
        <div class="square black"><span class="piece black-piece">&#9819;</span></div>
        <div class="square white"><span class="piece black-piece">&#9818;</span></div>
        <div class="square black"><span class="piece black-piece">&#9821;</span></div>
        <div class="square white"><span class="piece black-piece">&#9822;</span></div>
        <div class="square black"><span class="piece black-piece">&#9820;</span></div>

        <!-- Row 7 -->
        <div class="square black"><span class="piece black-piece">&#9823;</span></div>
        <div class="square white"><span class="piece black-piece">&#9823;</span></div>
        <div class="square black"><span class="piece black-piece">&#9823;</span></div>
        <div class="square white"><span class="piece black-piece">&#9823;</span></div>
        <div class="square black"><span class="piece black-piece">&#9823;</span></div>
        <div class="square white"><span class="piece black-piece">&#9823;</span></div>
        <div class="square black"><span class="piece black-piece">&#9823;</span></div>
        <div class="square white"><span class="piece black-piece">&#9823;</span></div>

        <!-- Row 6 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 5 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 4 -->
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>

        <!-- Row 3 -->
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>
        <div class="square black"></div>
        <div class="square white"></div>

        <!-- Row 2 -->
        <div class="square white"><span class="piece white-piece">&#9817;</span></div>
        <div class="square black"><span class="piece white-piece">&#9817;</span></div>
        <div class="square white"><span class="piece white-piece">&#9817;</span></div>
        <div class="square black"><span class="piece white-piece">&#9817;</span></div>
        <div class="square white"><span class="piece white-piece">&#9817;</span></div>
        <div class="square black"><span class="piece white-piece">&#9817;</span></div>
        <div class="square white"><span class="piece white-piece">&#9817;</span></div>
        <div class="square black"><span class="piece white-piece">&#9817;</span></div>

        <!-- Row 1 -->
        <div class="square black"><span class="piece white-piece">&#9814;</span></div>
        <div class="square white"><span class="piece white-piece">&#9816;</span></div>
        <div class="square black"><span class="piece white-piece">&#9815;</span></div>
        <div class="square white"><span class="piece white-piece">&#9813;</span></div>
        <div class="square black"><span class="piece white-piece">&#9812;</span></div>
        <div class="square white"><span class="piece white-piece">&#9815;</span></div>
        <div class="square black"><span class="piece white-piece">&#9816;</span></div>
        <div class="square white"><span class="piece white-piece">&#9814;</span></div>
    </div>

</body>
</html>
